services:
  # Database
  db:
    image: mariadb:11
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: highwind
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      db:
        condition: service_healthy
    image: phpmyadmin:latest
    ports:
      - '8080:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: highwind
      UPLOAD_LIMIT: 64M

  # WordPress
  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    ports:
      - '8000:80'
    restart: unless-stopped
    volumes:
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./config/wordpress/wp-config.php:/var/www/html/wp-config.php
      - ./config/wordpress/.htaccess:/var/www/html/.htaccess
      - ./plugins:/var/www/html/wp-content/plugins
      - wordpress_data:/var/www/html
      - ./logs:/var/log/apache2
      - ./logs/debug.log:/var/www/html/wp-content/debug.log
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1

  # WP-CLI — keep alive for ad-hoc commands: docker compose exec wp-cli wp <command>
  # wp-cli:
  #   image: wordpress:cli
  #   depends_on:
  #     - db
  #     - wordpress
  #   volumes:
  #     - wordpress_data:/var/www/html
  #   environment:
  #     WORDPRESS_DB_HOST: db:3306
  #     WORDPRESS_DB_USER: wordpress
  #     WORDPRESS_DB_PASSWORD: wordpress
  #   entrypoint: ["sleep", "9999"]

volumes:
  database: {}
  wordpress_data: {}
