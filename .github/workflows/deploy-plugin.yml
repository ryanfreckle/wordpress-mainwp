name: Deploy plugin to WP server

# Builds each plugin listed in the matrix below (via bin/plugin/dist.js) and
# FTP-syncs the result straight into wp-content/plugins on the MainWP
# management server. Plain FTP, not SFTP — this shared host doesn't run an
# SSH/SFTP daemon (confirmed by an SFTP attempt getting rejected with
# publickey/gssapi-only auth methods, i.e. nothing was listening as SSH).
# Full-sync every run — no changed-file diffing/marker file, since each
# plugin folder is small enough that re-uploading it whole each time is
# simpler and more robust than tracking state.
#
# To deploy an additional plugin: add its plugins/<folder> name to the
# matrix list below. Each one gets its own build + deploy job, in parallel.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Path on the server to the *parent* plugins directory (each plugin's own
  # folder name is appended automatically). Edit this to match your server.
  REMOTE_PLUGINS_PATH: public_html/wordpress.developandtest.uk/wp-content/plugins

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        plugin: [mainwp-development-extension, freckle-lockdown]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLUGIN_NAME: ${{ matrix.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build plugin
        run: node bin/plugin/dist.js "$PLUGIN_NAME"

      - name: Deploy via FTP
        env:
          # Secret names kept as-is (WP_SFTP_*) from the original SFTP setup
          # — same host/credentials, just spoken over FTP instead now.
          FTP_HOST: ${{ secrets.WP_SFTP_HOST }}
          FTP_USERNAME: ${{ secrets.WP_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.WP_SFTP_PASSWORD }}
        run: |
          set -e

          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "❌ Missing one or more secrets: WP_SFTP_HOST, WP_SFTP_USERNAME, WP_SFTP_PASSWORD"
            exit 1
          fi

          sudo apt-get install -y -qq lftp

          LOCAL_DIR="dist/${PLUGIN_NAME}"
          REMOTE_DIR="${REMOTE_PLUGINS_PATH}/${PLUGIN_NAME}"

          if [ ! -d "$LOCAL_DIR" ]; then
            echo "❌ Build output not found: $LOCAL_DIR"
            exit 1
          fi

          safe_user="${FTP_USERNAME//\\/\\\\}"; safe_user="${safe_user//\"/\\\"}"
          safe_pass="${FTP_PASSWORD//\\/\\\\}"; safe_pass="${safe_pass//\"/\\\"}"

          SCRIPT=$(mktemp)
          {
            echo "set ssl:verify-certificate no"
            echo "set ftp:passive-mode on"
            echo "set net:timeout 15"
            echo "set net:max-retries 3"
            echo "set net:reconnect-interval-base 3"
            echo "open ${FTP_HOST}"
            echo "user \"$safe_user\" \"$safe_pass\""
            echo "mkdir -f -p ${REMOTE_DIR}"
            echo "mirror -R --delete --verbose --parallel=3 ${LOCAL_DIR} ${REMOTE_DIR}"
          } > "$SCRIPT"

          echo "🚀 Syncing ${LOCAL_DIR} -> ${FTP_HOST}:${REMOTE_DIR}"
          lftp -f "$SCRIPT"
          rm -f "$SCRIPT"

          echo "✅ Deploy complete"
